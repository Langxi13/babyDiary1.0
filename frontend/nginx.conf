map $uri $baby_diary_cache_control {
    default "";
    =/index.html "no-cache";
    =/sw.js "no-cache";
    =/manifest.webmanifest "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $request_uri $baby_diary_resource_policy {
    default "same-origin";
    ~^/api/v3/public/media/ "cross-origin";
}

proxy_cache_path /var/cache/nginx/media-cache levels=1:2 keys_zone=media_cache:4m
                 max_size=128m inactive=10m use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 300m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "$baby_diary_resource_policy" always;
    add_header Cache-Control "$baby_diary_cache_control" always;

    location ^~ /api/v3/public/media/ {
        proxy_pass http://backend:10002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_cache media_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri:$http_range";
        proxy_cache_convert_head off;
        proxy_cache_valid 200 206 5m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_revalidate on;
    }

    location /api/ {
        proxy_pass http://backend:10002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
