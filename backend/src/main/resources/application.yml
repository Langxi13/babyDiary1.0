spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      timeout: 500ms
      connect-timeout: 500ms
  datasource:
    url: ${V3_DB_URL:jdbc:mysql://127.0.0.1:3306/baby_diary_v3?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${V3_DB_USERNAME:${DB_USERNAME:baby_diary}}
    password: ${V3_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${V3_DB_POOL_MAX:8}
      minimum-idle: ${V3_DB_POOL_MIN:2}
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  task:
    execution:
      pool:
        core-size: 1
        max-size: 2
        queue-capacity: 20

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:10002}

jwt:
  secret: ${JWT_SECRET:development-only-jwt-signing-key-change-before-deploying}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  native-origins: ${CORS_NATIVE_ORIGINS:https://localhost,capacitor://localhost}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  release:
    version: ${APP_RELEASE_VERSION:3.0.0}
    android:
      enabled: ${ANDROID_UPDATE_ENABLED:false}
      distribution: ${ANDROID_UPDATE_DISTRIBUTION:DIRECT}
      latest-version-code: ${ANDROID_UPDATE_VERSION_CODE:0}
      latest-version-name: ${ANDROID_UPDATE_VERSION_NAME:}
      minimum-version-code: ${ANDROID_MINIMUM_VERSION_CODE:1}
      download-url: ${ANDROID_UPDATE_URL:}
      sha256: ${ANDROID_UPDATE_SHA256:}
      release-notes: ${ANDROID_UPDATE_RELEASE_NOTES:}
      mandatory: ${ANDROID_UPDATE_MANDATORY:false}
  invitation:
    bootstrap-code: ${INVITATION_CODE:}
  auth:
    refresh-days: ${AUTH_REFRESH_DAYS:30}
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    public-url: ${PUBLIC_URL:http://localhost:5173}
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@example.com}
  storage:
    provider: ${OBJECT_STORAGE_PROVIDER:local}
    local-root: ${DIARY_OBJECT_PATH:${user.dir}/data/objects/}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:baby-diary}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  export:
    pdf-font-path: ${PDF_FONT_PATH:/usr/share/fonts/truetype/unifont/unifont.ttf}
  media:
    url-signing-key: ${V3_MEDIA_URL_SIGNING_KEY:${JWT_SECRET:development-only-media-signing-key}}
    url-lifetime-seconds: ${V3_MEDIA_URL_LIFETIME_SECONDS:1800}
    protected-url-lifetime-seconds: ${V3_MEDIA_PROTECTED_URL_LIFETIME_SECONDS:300}
    processing-min-free-bytes: ${V3_MEDIA_PROCESSING_MIN_FREE_BYTES:3221225472}
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
  jobs:
    enabled: ${V3_JOBS_ENABLED:true}
    worker-id: ${V3_WORKER_ID:${HOSTNAME:single-node}}
    poll-delay-ms: ${V3_JOB_POLL_DELAY_MS:2000}
    stale-after-minutes: ${V3_JOB_STALE_MINUTES:30}
    recovery-delay-ms: ${V3_JOB_RECOVERY_DELAY_MS:300000}
  cache:
    enabled: ${V3_CACHE_ENABLED:true}
    prefix: ${CACHE_PREFIX:baby-diary:v3:cache:}
  outbox:
    enabled: ${V3_OUTBOX_ENABLED:true}
    poll-delay-ms: ${V3_OUTBOX_POLL_DELAY_MS:2000}
    stale-after-minutes: ${V3_OUTBOX_STALE_MINUTES:10}
    recovery-delay-ms: ${V3_OUTBOX_RECOVERY_DELAY_MS:300000}
  reminders:
    enabled: ${V3_REMINDERS_ENABLED:true}
    delivery-delay-ms: ${REMINDER_DELIVERY_DELAY_MS:60000}
  ai-schedules:
    enabled: ${V3_AI_SCHEDULES_ENABLED:true}
    poll-delay-ms: ${V3_AI_SCHEDULE_POLL_DELAY_MS:60000}
  retention:
    enabled: ${V3_RETENTION_ENABLED:true}
    diary-trash-days: ${V3_DIARY_TRASH_DAYS:30}
    sync-days: ${V3_SYNC_RETENTION_DAYS:90}
    diary-purge-cron: ${V3_DIARY_PURGE_CRON:0 25 4 * * *}
    data-cleanup-cron: ${V3_DATA_CLEANUP_CRON:0 45 4 * * *}
  rate-limit:
    enabled: ${V3_RATE_LIMIT_ENABLED:true}
    redis-enabled: ${V3_RATE_LIMIT_REDIS_ENABLED:false}
  http:
    slow-request-threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:1000}

ai:
  config:
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:development-only-ai-encryption-key}

invitation-code:
  encryption-key: ${INVITATION_CODE_ENCRYPTION_KEY:development-only-invitation-encryption-key}
